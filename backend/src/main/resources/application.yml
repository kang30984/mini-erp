spring:
  application:
    name: mini-erp
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minierp}
    username: ${DB_USER:minierp}
    password: ${DB_PASSWORD:minierp}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
